<p-card header="Build Screening Jobs">

  <form [formGroup]="form" (ngSubmit)="submit()">

    <div class="p-field">
      <label>Cycle</label>
      <input
        pInputText
        formControlName="cycle"
        placeholder="Enter Cycle Name"
        class="w-full" />
    </div>

    <button
      pButton
      type="submit"
      label="Build Jobs"
      icon="pi pi-cog"
      [loading]="loading"
      [disabled]="form.invalid">
    </button>

  </form>

</p-card>

<p-toast></p-toast>
